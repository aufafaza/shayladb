name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      
      - name: Build and run tests
        run: mvn -B verify -DskipTests=false -Dmaven.test.skip=false -Dmaven.test.failure.ignore=false

      - name: Require passing tests in every module with code
        run: |
          bad=0
          for module in $(sed -n 's:.*<module>\(.*\)</module>.*:\1:p' pom.xml); do
            # Interfaces only, nothing to test
            [ "$module" = "mdbms-api" ] && continue
            # No classes yet, so no tests required
            if [ -z "$(find "$module/src/main/java" -name '*.java' ! -name package-info.java)" ]; then
              echo "skip    $module (no code yet)"
              continue
            fi
            reports=$(ls "$module"/target/surefire-reports/TEST-*.xml 2>/dev/null || true)
            if [ -z "$reports" ]; then
              echo "::error::$module has no test cases"
              bad=1
              continue
            fi
            sum() { sed -n "s/.*<testsuite[^>]* $1=\"\([0-9]*\)\".*/\1/p" $reports | awk '{s+=$1} END {print s+0}'; }
            tests=$(sum tests); skipped=$(sum skipped); failed=$(( $(sum failures) + $(sum errors) ))
            if [ "$failed" -gt 0 ]; then
              echo "::error::$module has $failed failing test(s)"
              bad=1
            elif [ $((tests - skipped)) -eq 0 ]; then
              echo "::error::$module has no tests that actually ran (all skipped)"
              bad=1
            else
              echo "ok      $module ($((tests - skipped)) passed, $skipped skipped)"
            fi
          done
          exit $bad
